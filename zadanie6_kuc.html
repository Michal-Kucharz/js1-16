<script type="text/javascript">
document.write("<b>1) Rodzaje okienek: </b><br><ul><li>Okienko <b>alert</b> – wyświetlająca okienko dialogowe z informacją i przyciskiem OK</li><li>Okienko <b>prompt</b> – generująca okno, w którym użytkownik może wpisać wartość, zwracaną następnie do programu</li><li>Okienko <b>confirm</b> służy do tego, aby użytkownik coś potwierdził (stąd nazwa confirm)</li></ul><br>");
document.write("<b>2) Konwersji liczb: </b><br>Wczytanie zmiennej z użyciem <b>prompt</b> wykonywane jest jako ciąg znaków dlatego konieczna jest konwersji z ciągu znaków na wartości liczbowe aby wykonywac obliczenia.<ul><li><u>parseFloat(zmienna)</u> - konwersja zmiennej do typu float</li><li><u>parseInt(zmienna)</u> - konwersja zmiennej do typu int (liczbowego) </li><li><u>toString(zmienna)</u> - konwersja zmiennej do typu łańcuchowego</li></ul>");
document.write("<b>3) Przy nadawaniu nazw zmiennym należy przestrzegać pewnych zasad:</b><ol type=1><li>Nazwa zmiennej musi się zaczynać od litery, znaku \u0022$\u0022 lub \u0022_\u0022, może zawierać tylko litery (bez polskich znaków), cyfry oraz \u0022$\u0022 i \u0022_\u0022. <br><u>Poprawne nazwy zmiennych:</u> zmienna1, $wynik, _rozmiar, wynik1, Rekord, $_gracz<br><u>Błędne nazwy zmiennych:</u> 1zmienna, wynik gry, wysokosc&szerokosc, wynik.rekord, &gracz, wysokość, imie+nazwisko. </li><li>Wielkość liter ma znaczenie.<br><u>Rekord i rekord</u> to dwie różne zmienne! Jest to bardzo częsta przyczyna błędów w kodzie początkujących programistów.</li><li>Należy nie używać słów kluczowych JavaScript jako nazw zmiennych.</li></ol>");
document.write("<b>4) Omów typy zmiennych w Javascript: </b><br>Number - Typ liczbowy<ul><li>zmienne całkowite</li><li>zmienne zmiennoprzecinkowe</li></ul>String - Typ tekstowy<br>Boolea - Typ logiczny<br>Null - Pusta zawartość<br>Undefined - Typ niezidentyfikowany<br>Object - Obiekt")
</script>
